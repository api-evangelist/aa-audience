name: AA Audience
description: AA Audience is an adtech and data company that estimates a mobile user's credit
  score from their online activity using proprietary machine learning models. It collects data from
  partner mobile apps and ad networks, analyzes it, and connects with popular DSPs and DMPs so its
  clients - banks, credit card companies, and financial services firms - can target audiences
  interested in credit cards, loans, and financial services with guaranteed ROI. Publishers
  integrate a JavaScript header-bidding tag to enrich their bid stream; advertisers buy segments
  into their own DMP or as a DealID for their DSP, from a stated floor of $1 CPM. Surfaced as a
  portfolio company of 500 Global and added to the API Evangelist network. No public API, developer
  portal, documentation, specification, SDK, or public repository was found during enrichment - the
  site is five static HTML pages served from an S3 bucket whose homepage has not changed since March
  2018, and the Login link in the navigation is a dead button on a page with no form.
